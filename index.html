
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Business Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 25px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #38bdf8; }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      padding: 13px 22px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Digital Business Agent</h1>
    <p>Votre assistant commercial intelligent</p>

    <h3>Création de flyers publicitaires</h3>

    <textarea id="brief"
      placeholder="Décris le flyer que tu souhaites créer..."></textarea>

    <br>
    <button onclick="generateBrief()">
      Préparer mon projet
    </button>

    <p id="result"></p>
  </div>

  <script>
    function generateBrief() {
      const brief = document.getElementById("brief").value;

      if (!brief.trim()) {
        alert("Décris d'abord ton projet !");
        return;
      }

      document.getElementById("result").innerText =
        "Projet reçu ! Voici ton brief : " + brief;
    }
  </script>
</body>
</html>
